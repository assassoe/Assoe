# Project key and organization are supplied by GitHub Actions variables.
sonar.host.url=https://sonarcloud.io
sonar.sources=src,shared,studio,scripts
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/.sanity/**,**/*.astro,**/*.d.ts
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json,shared/tsconfig.json,studio/tsconfig.json
# Sonar coverage spans its analyzable sources, unlike our narrower V8 test scope.
sonar.javascript.lcov.reportPaths=quality-reports/frontend/lcov.info
